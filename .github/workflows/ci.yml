name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [HostTests, HostTestsRelease]
    steps:
      - uses: actions/checkout@v4
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build build-essential
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      - name: Architecture
        run: python3 -B scripts/check_architecture_dependencies.py
      - name: Publication tree
        run: python3 -B scripts/check_release.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi
      - name: Configure and build
        run: |
          cmake --preset ProductionRelease
          cmake --build --preset ProductionRelease --parallel 2
      - name: Audit generated ELF
        run: python3 -B scripts/audit_firmware.py --name ProductionRelease --build-dir build/ProductionRelease --output build/audit --home-period-ms 1
